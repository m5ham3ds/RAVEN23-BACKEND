name: RAVEN23 Production Registration Route Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-registration-route-probe.yml"

permissions:
  contents: read

concurrency:
  group: raven23-production-registration-route-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      API_ROOT: https://raven23-backend.onrender.com/api/v1
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Wait for the exact production version and database health
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          base = os.environ["API_ROOT"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"][:12]
          deadline = time.monotonic() + 15 * 60
          last = None
          while time.monotonic() < deadline:
              url = base + "/health?route_probe=" + urllib.parse.quote(str(int(time.time())))
              request = urllib.request.Request(url, headers={"Accept":"application/json","Cache-Control":"no-cache, no-store"})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              except Exception as error:
                  last = type(error).__name__
                  time.sleep(10)
                  continue
              try:
                  payload = json.loads(raw.decode("utf-8")) if raw else {}
              except Exception:
                  payload = {}
              live = (payload.get("runtime_target") or {}).get("render_git_commit")
              last = {"status":status,"database":payload.get("database"),"schema":payload.get("schema"),"commit":live}
              if status == 200 and payload.get("success") is True and payload.get("database") == "connected" and payload.get("schema") == "ready" and live == expected:
                  print("PASS: expected production commit is live and PostgreSQL is healthy.")
                  break
              time.sleep(10)
          else:
              raise SystemExit(f"Production version was not ready: {last!r}")
          PY

      - name: Verify POST registration reaches Laravel validation without inserting data
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = os.environ["API_ROOT"].rstrip("/")
          def post(path, payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers={
                  "Accept":"application/json",
                  "Content-Type":"application/json",
                  "Cache-Control":"no-cache, no-store",
                  "User-Agent":"RAVEN23-Production-Route-Probe",
              }, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              try:
                  body = json.loads(raw.decode("utf-8")) if raw else {}
              except Exception:
                  body = {}
              return status, body
          register_status, register = post("/auth/register", {})
          print("REGISTER ROUTE:", json.dumps({
              "status": register_status,
              "message": register.get("message"),
              "fields": sorted(register.keys())
          }, sort_keys=True))
          if register_status != 422:
              raise SystemExit("Expected HTTP 422 validation response for empty POST /auth/register.")
          login_status, login = post("/auth/login", {
              "email":"raven-route-probe@example.test",
              "password":"not-a-real-password"
          })
          print("LOGIN ROUTE:", json.dumps({
              "status": login_status,
              "message": login.get("message"),
              "fields": sorted(login.keys())
          }, sort_keys=True))
          if login_status != 401:
              raise SystemExit("Expected HTTP 401 for a valid-shaped login with nonexistent test identity.")
          print("PASS: register and login POST routes are reachable; no account or token was created.")
          PY

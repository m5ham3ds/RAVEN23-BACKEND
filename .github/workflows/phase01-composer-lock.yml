name: RAVEN23 Phase 01 Composer Lock Bootstrap

on:
  push:
    branches:
      - feature/phase-01-laravel-project
    paths:
      - composer.json

permissions:
  contents: write

jobs:
  generate-lock:
    name: Resolve and commit the initial Composer lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the phase branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up PHP 8.4 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_pgsql, pdo_sqlite, xml, zip
          coverage: none

      - name: Resolve the initial dependency graph
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Validate the manifest and resolved lock
        run: composer validate --strict

      - name: Verify a clean locked installation
        run: |
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress

      - name: Commit the generated lock file to this phase branch
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: add reproducible Composer lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

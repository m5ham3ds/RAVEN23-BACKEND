name: RAVEN23 Live Authentication Smoke

on:
  workflow_run:
    workflows: ["RAVEN23 Backend Docker Validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: raven23-live-auth-smoke
  cancel-in-progress: false

jobs:
  live-auth-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ROOT: https://raven23-backend.onrender.com/api/v1
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Wake Render, then wait for the exact source commit
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse

          base = os.environ["API_ROOT"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"][:12]
          deadline = time.monotonic() + 15 * 60
          last = None
          attempt = 0
          consecutive_healthy = 0

          def request_health():
              url = base + "/health?wake_probe=" + urllib.parse.quote(str(int(time.time())))
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store",
                      "Pragma": "no-cache",
                      "User-Agent": "RAVEN23-GitHub-Actions-Cold-Start-Probe",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      status = response.status
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              try:
                  payload = json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  payload = {}
              return status, payload

          # This is an external HTTP request. Render's proxy can use it to wake
          # a sleeping free service; continue after transient cold-start errors.
          while time.monotonic() < deadline:
              attempt += 1
              try:
                  status, health = request_health()
                  target = health.get("runtime_target") or {}
                  live_sha = target.get("render_git_commit", "unknown")
                  last = {
                      "http_status": status,
                      "success": health.get("success"),
                      "database": health.get("database"),
                      "schema": health.get("schema"),
                      "live_commit": live_sha,
                  }
                  if (
                      status == 200
                      and health.get("success") is True
                      and health.get("database") == "connected"
                      and health.get("schema") == "ready"
                      and (live_sha == expected or live_sha == "unknown")
                  ):
                      consecutive_healthy += 1
                      if consecutive_healthy >= 2:
                          if health.get("google_auth") != "configured":
                          raise SystemExit("Google OAuth is not configured in the live backend.")
                              print(f"PASS: Render woke and serves expected deployment for {expected}; Neon, schema and Google auth are healthy.")
                              raise SystemExit(0)
                  else:
                      consecutive_healthy = 0
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  consecutive_healthy = 0
                  last = {"transport_error": type(error).__name__}
              time.sleep(5 if attempt < 6 else 10)

          raise SystemExit(f"Render did not become healthy on commit {expected} after wake retries; attempts={attempt}; last={last!r}")
          PY

      - name: Exercise live email, guest, device-session and token-revocation flows
        run: |
          python3 - <<'PY'
          import json, os, uuid, urllib.request, urllib.error

          base = os.environ["API_ROOT"].rstrip("/")
          suffix = uuid.uuid4().hex
          email = f"raven23-ci-{suffix}@example.test"
          username = f"raven_ci_{suffix[:16]}"
          password = f"Raven23-CI-{suffix[:16]}-Safe!"
          device_id = str(uuid.uuid4())
          tokens = []
          guest_tokens = []

          def call(method, path, body=None, token=None, expected=(200,)):
              payload = None if body is None else json.dumps(body).encode("utf-8")
              headers = {"Accept": "application/json", "Cache-Control": "no-cache", "User-Agent": "RAVEN23-GitHub-Actions-Auth-Smoke"}
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = "Bearer " + token
              request = urllib.request.Request(base + path, data=payload, headers=headers, method=method)
              try:
                  response = urllib.request.urlopen(request, timeout=60)
                  status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              try:
                  data = json.loads(raw.decode("utf-8")) if raw else {}
              except json.JSONDecodeError:
                  data = {}
              if status not in expected:
                  diagnostic = data.get("diagnostic") if isinstance(data, dict) else None
                  request_id = data.get("request_id") if isinstance(data, dict) else None
                  raise RuntimeError(f"{method} {path}: expected {expected}, received {status}; request_id={request_id}; safe_diagnostic={diagnostic}")
              return status, data

          def profile(token, expected=(200,)):
              return call("GET", "/user/profile", token=token, expected=expected)

          def delete_account(token):
              try:
                  call("DELETE", "/user/account", token=token, expected=(200,))
              except Exception as error:
                  print(f"Cleanup warning (non-fatal): {type(error).__name__}")

          try:
              _, registered = call("POST", "/auth/register", {
                  "name": "RAVEN23 CI User", "email": email, "username": username,
                  "password": password, "device_id": device_id,
                  "device_name": "GitHub Actions disposable test", "platform": "android",
              }, expected=(201,))
              first_token = registered.get("token")
              user_id = (registered.get("user") or {}).get("id")
              if not first_token or not user_id:
                  raise RuntimeError("Registration response omitted its account or session.")
              tokens.append(first_token)
              _, first_profile = profile(first_token)
              if (first_profile.get("user") or {}).get("id") != user_id:
                  raise RuntimeError("Profile did not resolve the registered PostgreSQL user.")

              _, login = call("POST", "/auth/login", {
                  "email": email, "password": password, "device_id": device_id,
                  "device_name": "GitHub Actions disposable test", "platform": "android",
              })
              second_token = login.get("token")
              if not second_token or (login.get("user") or {}).get("id") != user_id:
                  raise RuntimeError("Email login did not return the same database account.")
              tokens.append(second_token)
              profile(first_token, expected=(401,))
              profile(second_token)

              call("POST", "/auth/login", {"email": email, "password": "incorrect-password-for-smoke-test"}, expected=(401,))
              call("POST", "/auth/logout", token=second_token)
              profile(second_token, expected=(401,))

              _, relogin = call("POST", "/auth/login", {
                  "email": email, "password": password, "device_id": device_id,
                  "device_name": "GitHub Actions disposable test", "platform": "android",
              })
              final_token = relogin.get("token")
              if not final_token:
                  raise RuntimeError("Re-login after logout did not issue a new session.")
              tokens.append(final_token)
              call("DELETE", "/user/account", token=final_token)
              profile(final_token, expected=(401,))
              profile(first_token, expected=(401,))

              _, guest = call("POST", "/auth/guest")
              guest_token = guest.get("token")
              guest_id = (guest.get("user") or {}).get("id")
              if not guest_token or not guest_id:
                  raise RuntimeError("Guest endpoint did not persist a guest identity.")
              guest_tokens.append(guest_token)
              _, guest_profile = profile(guest_token)
              if (guest_profile.get("user") or {}).get("id") != guest_id:
                  raise RuntimeError("Guest profile does not match its persisted account.")
              call("DELETE", "/user/account", token=guest_token)
              profile(guest_token, expected=(401,))

              print("PASS: live email registration/login, wrong-password rejection, profile persistence, same-device token replacement, logout revocation, deletion cleanup and guest lifecycle.")
          finally:
              for token in tokens + guest_tokens:
                  delete_account(token)
          PY

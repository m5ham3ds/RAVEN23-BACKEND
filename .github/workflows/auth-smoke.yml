name: RAVEN23 Runtime HTTP Smoke

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Full API base URL ending in /api/v1 (the service to inspect)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: raven23-runtime-http-smoke
  cancel-in-progress: false

jobs:
  runtime-http-smoke:
    name: Check liveness, readiness and API route registration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Verify non-mutating HTTP health and route contracts
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ["API_BASE_URL"].strip().rstrip("/")
          if not api.endswith("/api/v1"):
              raise SystemExit("api_base_url must end in /api/v1")

          service_root = api[:-len("/api/v1")]

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store",
                      "User-Agent": "RAVEN23-Manual-HTTP-Smoke",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          status, raw = get(service_root + "/up")
          if status != 200:
              raise SystemExit(f"Liveness failed: HTTP {status}")
          print("PASS: /up liveness returned HTTP 200 without requiring PostgreSQL.")

          status, raw = get(service_root + "/ready")
          try:
              ready = json.loads(raw.decode("utf-8"))
          except Exception:
              ready = {}
          if status != 200 or ready.get("success") is not True:
              raise SystemExit(f"Readiness failed: HTTP {status}; checks={ready.get('checks')}")
          print("PASS: /ready confirms database connectivity and schema readiness.")

          status, raw = get(api + "/health")
          try:
              health = json.loads(raw.decode("utf-8"))
          except Exception:
              health = {}
          if (
              status != 200
              or health.get("success") is not True
              or health.get("database") != "connected"
              or health.get("schema") != "ready"
          ):
              raise SystemExit(f"API health contract failed: HTTP {status}")
          print("PASS: /api/v1/health returned the provider-neutral readiness contract.")

          routes = {
              "register": "/auth/register",
              "login": "/auth/login",
              "google": "/auth/google",
              "guest": "/auth/guest",
              "profile": "/user/profile",
          }
          for name, path in routes.items():
              route_status, _ = get(api + path)
              # GET against POST-only auth routes yields 405; protected profile
              # yields 401. A 404 would mean the route is not registered.
              if route_status not in (200, 204, 401, 405):
                  raise SystemExit(f"Route {name} is not registered/reachable: HTTP {route_status}")
          print("PASS: authentication and profile route paths exist; no registration/login/delete requests were sent.")
          print("This smoke test is read-only and does not create users, issue tokens, or run migrations.")
          PY

name: RAVEN23 Live Authentication Smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven23-live-auth-smoke
  cancel-in-progress: true

jobs:
  live-auth-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ROOT: https://raven23-backend.onrender.com/api/v1
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Wake Render, then wait for the exact source commit
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse

          base = os.environ["API_ROOT"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"][:12]
          deadline = time.monotonic() + 15 * 60
          last = None
          attempt = 0
          consecutive_healthy = 0

          def request_health():
              url = base + "/health?wake_probe=" + urllib.parse.quote(str(int(time.time())))
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store",
                      "Pragma": "no-cache",
                      "User-Agent": "RAVEN23-GitHub-Actions-Cold-Start-Probe",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      status = response.status
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              try:
                  payload = json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  payload = {}
              return status, payload

          # This is an external HTTP request. Render's proxy can use it to wake
          # a sleeping free service; continue after transient cold-start errors.
          while time.monotonic() < deadline:
              attempt += 1
              try:
                  status, health = request_health()
                  target = health.get("runtime_target") or {}
                  live_sha = target.get("render_git_commit", "unknown")
                  last = {
                      "http_status": status,
                      "success": health.get("success"),
                      "database": health.get("database"),
                      "schema": health.get("schema"),
                      "live_commit": live_sha,
                  }
                  if (
                      status == 200
                      and health.get("success") is True
                      and health.get("database") == "connected"
                      and health.get("schema") == "ready"
                      and live_sha == expected
                  ):
                      if health.get("google_auth") != "configured":
                          raise SystemExit("Google OAuth is not configured in the live backend.")
                      consecutive_healthy += 1
                      if consecutive_healthy >= 2:
                          print(f"PASS: Render woke and serves expected commit {expected}; Neon, schema and Google auth are healthy.")
                          raise SystemExit(0)
                  else:
                      consecutive_healthy = 0
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  consecutive_healthy = 0
                  last = {"transport_error": type(error).__name__}
              time.sleep(5 if attempt < 6 else 10)

          raise SystemExit(f"Render did not become healthy on commit {expected} after wake retries; attempts={attempt}; last={last!r}")
          PY

      - name: Verify live production route table and backend response
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base = os.environ["API_ROOT"].rstrip("/")
          required = {
              "register": "/auth/register",
              "login": "/auth/login",
              "google": "/auth/google",
              "guest": "/auth/guest",
              "profile": "/user/profile",
          }

          def get(path):
              request = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store",
                      "User-Agent": "RAVEN23-Production-Route-Verification",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          # GET-only, non-mutating checks against the currently deployed
          # production service. Auth POST/DELETE operations are never sent here.
          status, raw = get("/health")
          health = json.loads(raw.decode("utf-8")) if raw else {}
          if status != 200 or health.get("success") is not True:
              raise SystemExit(f"Live health contract failed: HTTP {status}")
          if health.get("database") != "connected" or health.get("schema") != "ready":
              raise SystemExit("Live backend is not connected to its production PostgreSQL schema.")

          # Probe method matching for each auth endpoint using OPTIONS (no account
          # creation, no credentials, no token issuance, no destructive request).
          for name, path in required.items():
              route_status, _ = get(path)
              # Laravel returns 405 for GET against existing POST endpoints,
              # and 401 for the protected profile route. 404 means route missing.
              allowed = (405, 401, 200, 204)
              if route_status not in allowed:
                  raise SystemExit(f"Live route {name} is not reachable: HTTP {route_status}")
          print("PASS: live health and auth route URLs are registered and reachable without mutating user data.")
          print("NOTE: this check does not perform account registration/login; PostgreSQL lifecycle is tested in isolated CI.")
          PY

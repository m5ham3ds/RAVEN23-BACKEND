name: RAVEN23 Production Account Creation Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-account-smoke.yml"

permissions:
  contents: read

concurrency:
  group: raven23-production-account-smoke
  cancel-in-progress: false

jobs:
  production-account-lifecycle:
    name: Register, sign in, verify and remove a temporary production account
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ROOT: https://raven23-backend.onrender.com/api/v1
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Wait for Render to serve this exact commit with a healthy production database
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse

          base = os.environ["API_ROOT"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"][:12]
          deadline = time.monotonic() + 15 * 60
          attempt = 0
          last = None

          while time.monotonic() < deadline:
              attempt += 1
              url = base + "/health?production_account_test=" + urllib.parse.quote(str(int(time.time())))
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-cache, no-store",
                  "Pragma": "no-cache",
                  "User-Agent": "RAVEN23-Production-Account-Test",
              })
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  last = {"transport": type(error).__name__}
                  time.sleep(10)
                  continue

              try:
                  payload = json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  payload = {}
              target = payload.get("runtime_target") or {}
              live = target.get("render_git_commit", "unknown")
              last = {"http": status, "database": payload.get("database"),
                      "schema": payload.get("schema"), "commit": live}
              if (status == 200 and payload.get("success") is True
                  and payload.get("database") == "connected"
                  and payload.get("schema") == "ready" and live == expected):
                  print("PASS: production Render service is healthy, PostgreSQL schema is ready, and deployed SHA matches.")
                  break
              time.sleep(10)
          else:
              raise SystemExit(f"Production service did not become healthy on expected commit; attempts={attempt}; last={last!r}")
          PY

      - name: Perform a real registration, login, profile and cleanup against production PostgreSQL
        run: |
          python3 - <<'PY'
          import json, os, secrets, time, uuid, urllib.request, urllib.error

          base = os.environ["API_ROOT"].rstrip("/")
          suffix = uuid.uuid4().hex[:16]
          email = f"raven-live-ci-{suffix}@example.test"
          username = f"raven_live_{suffix}"
          password = "Rv!" + secrets.token_urlsafe(24)
          device_id = str(uuid.uuid4())
          device = {
              "device_id": device_id,
              "device_name": "RAVEN23 production CI test",
              "platform": "android",
          }
          tokens = []
          registration_attempted = False
          account_creation_confirmed = False
          cleanup_confirmed = False
          failure = None

          def call(method, path, payload=None, token=None):
              body = json.dumps(payload).encode("utf-8") if payload is not None else None
              headers = {
                  "Accept": "application/json",
                  "Cache-Control": "no-cache, no-store",
                  "User-Agent": "RAVEN23-Production-Account-Lifecycle-Test",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(base + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              try:
                  data = json.loads(raw.decode("utf-8")) if raw else {}
              except (UnicodeDecodeError, json.JSONDecodeError):
                  data = {}
              return status, data

          def check(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def verify_deleted():
              # A 401 for password login proves the synthetic account no longer exists.
              status, _ = call("POST", "/auth/login", {"email": email, "password": password})
              return status == 401

          def cleanup():
              # Try every known credential in reverse order; the newest same-device
              # session is the only one expected to remain active.
              for token in reversed(tokens):
                  try:
                      status, _ = call("DELETE", "/user/account", {}, token)
                      if status == 200 and verify_deleted():
                          return True
                  except Exception:
                      pass
              # Recover when account insertion succeeded but the registration
              # response/session issuance was interrupted before returning a token.
              try:
                  status, session = call("POST", "/auth/login", {
                      "email": email, "password": password, **device,
                  })
                  token = session.get("token")
                  if status == 200 and isinstance(token, str) and token:
                      tokens.append(token)
                      deleted, _ = call("DELETE", "/user/account", {}, token)
                      return deleted == 200 and verify_deleted()
                  return status == 401 and verify_deleted()
              except Exception:
                  return False

          try:
              registration_attempted = True
              status, registered = call("POST", "/auth/register", {
                  "name": "RAVEN23 Production Smoke",
                  "email": email,
                  "username": username,
                  "password": password,
                  **device,
              })
              check(status == 201, f"Registration returned HTTP {status}; response fields={sorted(registered.keys())}")
              account_creation_confirmed = True
              check(registered.get("success") is True, "Registration response did not indicate success.")
              user = registered.get("user") or {}
              user_id = user.get("id")
              first_token = registered.get("token")
              check(isinstance(user_id, int) and user_id > 0, "Registration did not return a valid account ID.")
              check(isinstance(first_token, str) and first_token, "Registration did not return a bearer session.")
              tokens.append(first_token)

              status, profile = call("GET", "/user/profile", token=first_token)
              check(status == 200 and profile.get("success") is True, f"New account profile returned HTTP {status}.")
              check((profile.get("user") or {}).get("id") == user_id, "Profile endpoint returned a different account.")

              status, logged_in = call("POST", "/auth/login", {
                  "email": email, "password": password, **device,
              })
              check(status == 200 and logged_in.get("success") is True, f"Password login returned HTTP {status}.")
              check((logged_in.get("user") or {}).get("id") == user_id, "Login returned a different account.")
              second_token = logged_in.get("token")
              check(isinstance(second_token, str) and second_token, "Login did not return a bearer session.")
              tokens.append(second_token)

              old_status, _ = call("GET", "/user/profile", token=first_token)
              check(old_status == 401, f"Same-device login did not revoke the previous token (HTTP {old_status}).")
              new_status, active_profile = call("GET", "/user/profile", token=second_token)
              check(new_status == 200 and (active_profile.get("user") or {}).get("id") == user_id,
                    f"Newly issued token could not read the account profile (HTTP {new_status}).")

              status, deleted = call("DELETE", "/user/account", {}, second_token)
              check(status == 200 and deleted.get("success") is True, f"Account deletion returned HTTP {status}.")
              cleanup_confirmed = verify_deleted()
              check(cleanup_confirmed, "Password login still succeeds after deleting the temporary account.")

              token_status, _ = call("GET", "/user/profile", token=second_token)
              check(token_status == 401, f"Deleted account token remains usable (HTTP {token_status}).")
              print("PASS: actual production account registration returned 201.")
              print("PASS: production profile read, password login and device-token replacement succeeded.")
              print("PASS: temporary production account was deleted; password login now returns 401.")
              print("PASS: all issued test session tokens are invalid after deletion.")
          except Exception as error:
              failure = str(error)
          finally:
              if registration_attempted and not cleanup_confirmed:
                  cleanup_confirmed = cleanup()
                  if cleanup_confirmed:
                      print("CLEANUP: verified removal of the temporary production account after the test path.")
                  else:
                      raise SystemExit(
                          "CRITICAL: could not verify cleanup of the synthetic production account. "
                          "Do not repeat registration until the account is inspected and removed."
                      )

          if failure:
              raise SystemExit("FAIL: " + failure)
          PY

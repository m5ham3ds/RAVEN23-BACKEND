name: RAVEN23 Runtime Database Diagnostics

on:
  # Run automatically when this diagnostic workflow is deliberately updated.
  # All steps are read-only against Neon; the temporary HTTP container is removed.
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-db-diagnostics.yml"
      - "docker/runtime-db-diagnostics.php"
  workflow_dispatch:
    inputs:
      run_mode:
        description: Which Neon endpoint to test
        required: true
        type: choice
        options:
          - both
          - pooled
          - direct
        default: both

permissions:
  contents: read

concurrency:
  group: raven23-runtime-db-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Build production image and test Neon connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Validate required repository secrets
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          NEON_DB_MIGRATION_URL: ${{ secrets.NEON_DB_MIGRATION_URL }}
        run: |
          set -eu
          test -n "$NEON_DB_URL" || { echo "::error::Missing repository secret NEON_DB_URL"; exit 1; }
          test -n "$NEON_DB_MIGRATION_URL" || { echo "::error::Missing repository secret NEON_DB_MIGRATION_URL"; exit 1; }
          echo "Both Neon connection secrets are present. Values are not displayed."

      - name: Build the exact Render Dockerfile
        run: docker build --pull -t raven23-backend:diagnostics .

      - name: Diagnose pooled application connection
        if: github.event_name == 'push' || inputs.run_mode == 'both' || inputs.run_mode == 'pooled'
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          set -eu
          docker run --rm \
            --network bridge \
            -e DB_CONNECTION=pgsql \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e DB_URL="$NEON_DB_URL" \
            -e RAVEN_DIAG_MODE=pooled \
            -e RAVEN_DIAG_INSPECT_USER_IDS=165,168 \
            -v "$GITHUB_WORKSPACE/docker:/diagnostics:ro" \
            --entrypoint php \
            raven23-backend:diagnostics \
            /diagnostics/runtime-db-diagnostics.php

      - name: Diagnose direct migration connection
        if: github.event_name == 'push' || inputs.run_mode == 'both' || inputs.run_mode == 'direct'
        env:
          NEON_DB_MIGRATION_URL: ${{ secrets.NEON_DB_MIGRATION_URL }}
        run: |
          set -eu
          docker run --rm \
            --network bridge \
            -e DB_CONNECTION=pgsql \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e DB_URL="$NEON_DB_MIGRATION_URL" \
            -e RAVEN_DIAG_MODE=direct \
            -e RAVEN_DIAG_INSPECT_USER_IDS=165,168 \
            -v "$GITHUB_WORKSPACE/docker:/diagnostics:ro" \
            --entrypoint php \
            raven23-backend:diagnostics \
            /diagnostics/runtime-db-diagnostics.php

      - name: Confirm repository Neon secret matches the live Render database target
        if: github.event_name == 'push' || inputs.run_mode == 'both' || inputs.run_mode == 'pooled'
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from urllib.parse import parse_qs, unquote, urlsplit

          parsed = urlsplit(os.environ["NEON_DB_URL"])
          expected_host = (parsed.hostname or "").lower().replace("-pooler.", ".")
          expected_database = unquote(parsed.path.strip("/"))
          query = parse_qs(parsed.query)
          expected_schema = (query.get("schema") or ["public"])[0].lower()

          request = urllib.request.Request(
              "https://raven23-backend.onrender.com/api/v1/health?target_check=" + str(int(time.time())),
              headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-cache, no-store",
                  "User-Agent": "RAVEN23-Neon-Target-Match",
              },
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              status = response.status
              health = json.loads(response.read().decode("utf-8"))

          target = health.get("runtime_target") or {}
          actual_host = str(target.get("configured_host") or "").lower()
          actual_database = str(target.get("configured_database") or "")
          connected_database = str(target.get("database_name") or "")
          actual_schema = str(target.get("schema_name") or "").lower()

          print(f"CI_NEON_TARGET host={expected_host} database={expected_database} schema={expected_schema}")
          print(f"RENDER_TARGET host={actual_host} database={actual_database} connected_database={connected_database} schema={actual_schema}")

          if (
              status != 200
              or health.get("success") is not True
              or health.get("database") != "connected"
              or health.get("schema") != "ready"
              or expected_host != actual_host
              or expected_database != actual_database
              or expected_database != connected_database
              or expected_schema != actual_schema
          ):
              raise SystemExit("FAIL: GitHub Neon secret does not match the live Render application database target.")

          print("PASS: GitHub Neon diagnostic secret and live Render application use the same PostgreSQL host, database and schema.")
          PY

      - name: Verify production HTTP process retains Neon environment
        if: github.event_name == 'push' || inputs.run_mode == 'both' || inputs.run_mode == 'pooled'
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          set -eu
          container_name="raven23-http-env-smoke"
          response_file="$RUNNER_TEMP/raven23-health.json"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Start the exact production PHP HTTP server/router used by docker/start.sh.
          # This bypasses migrations so the diagnostic remains read-only.
          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1:18080:18080 \
            -e DB_CONNECTION=pgsql \
            -e DB_URL="$NEON_DB_URL" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e LOG_CHANNEL=stderr \
            --entrypoint php \
            raven23-backend:diagnostics \
            -S 0.0.0.0:18080 -t public /usr/local/bin/raven23-router.php

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --max-time 5 \
              http://127.0.0.1:18080/api/v1/health \
              --output "$response_file"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "::error::The production HTTP server did not return a health response."
            docker logs "$container_name" || true
            exit 1
          fi

          echo "HTTP server returned a response. Validating health and environment markers."
          jq -e '
            .success == true and
            .database == "connected" and
            .schema == "ready" and
            .runtime_target.connection == "pgsql" and
            .runtime_target.driver == "pgsql" and
            .runtime_target.db_url_env_present == true and
            .runtime_target.db_url_config_present == true and
            .runtime_target.configured_database == "neondb"
          ' "$response_file" >/dev/null || {
            echo "::error::The HTTP process did not retain the expected PostgreSQL environment or schema."
            jq 'del(.runtime_target.endpoint_host)' "$response_file" || true
            docker logs "$container_name" || true
            exit 1
          }

          echo "PASS: production HTTP process retained DB_URL and successfully queried Neon."
      - name: Diagnostic summary
        if: always()
        run: |
          echo "The diagnostic output above reports URL host/database only, DNS, TCP, Laravel configuration, SELECT 1, and read-only row/token counts for IDs 165 and 168."
          echo "No connection URI, username, or password is intentionally printed."

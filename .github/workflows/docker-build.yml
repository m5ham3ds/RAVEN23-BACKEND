name: RAVEN23 Backend Docker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/phase-01-laravel-project, feature/phase-02-portable-runtime]

permissions:
  contents: read

concurrency:
  group: raven23-backend-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build and test portable Laravel runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raven23_test
          POSTGRES_USER: raven23_test
          POSTGRES_PASSWORD: raven23_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raven23_test -d raven23_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Resolve versioned FrankenPHP runtime base digest
        id: frankenphp-base
        shell: bash
        run: |
          set -euo pipefail
          image="dunglas/frankenphp:1.13.6-php8.4-trixie"
          inspect="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$inspect"
          digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          runtime_ref="$(awk '$1 == "FROM" && $0 ~ / AS runtime$/ { print $2; exit }' Dockerfile)"
          expected_ref="$image@$digest"
          if [[ "$runtime_ref" != "$expected_ref" ]]; then
            echo "::error::Dockerfile runtime base $runtime_ref does not match resolved digest $expected_ref"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved runtime base: $image@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Build portable FrankenPHP production image and run SQLite tests
        run: |
          docker build --pull \
            --build-arg RAVEN23_SOURCE_COMMIT="${GITHUB_SHA}" \
            -t raven23-backend:ci .

      - name: Build reusable PostgreSQL integration-test image
        run: docker build --pull --target postgres-test -t raven23-backend:postgres-test .

      - name: Verify Laravel Pint style on Phase 03 changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-feature/phase-02-portable-runtime}"
          git fetch origin "$base_ref"
          mapfile -t changed_php < <(git diff --name-only "origin/$base_ref...HEAD" -- '*.php')
          if [ "${#changed_php[@]}" -eq 0 ]; then
            echo "No changed PHP files require Pint validation."
            exit 0
          fi

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint php \
            raven23-backend:postgres-test \
            /opt/raven/vendor/bin/pint --test "${changed_php[@]}"

      - name: Verify production refuses APP_DEBUG=true
        run: |
          set -eu
          if docker run --rm --entrypoint /usr/local/bin/raven23-entrypoint \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e APP_ENV=production -e APP_DEBUG=true \
            raven23-backend:ci php -v; then
            echo "::error::Production entrypoint accepted APP_DEBUG=true."
            exit 1
          fi
          echo "PASS: production entrypoint rejects APP_DEBUG=true."

      - name: Prove web startup and liveness do not require a database
        run: |
          set -eu
          container_name=raven23-no-database-startup
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container_name" --network host \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=1 \
            -e DB_DATABASE=raven23_unavailable_test \
            -e DB_USERNAME=raven23_unavailable_test \
            -e DB_PASSWORD=unavailable \
            -e RAVEN23_SOURCE_COMMIT="${GITHUB_SHA}" \
            raven23-backend:ci

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:10000/up >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || {
            echo "::error::Web startup/liveness incorrectly depends on a database connection."
            docker logs "$container_name" || true
            exit 1
          }

          readiness_body_file="$(mktemp)"
          readiness_status="$(curl --silent --show-error --output "$readiness_body_file" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:10000/ready)"
          test "$readiness_status" = "503" || {
            echo "::error::Expected readiness HTTP 503 with PostgreSQL unreachable on 127.0.0.1:1; got $readiness_status."
            echo "Readiness response body:"
            cat "$readiness_body_file" || true
            echo "Container logs:"
            docker logs "$container_name" || true
            rm -f "$readiness_body_file"
            exit 1
          }
          jq -e '.success == false and .status == "not_ready" and .checks.application == "ok" and .checks.database == "unavailable" and .checks.schema == "unknown"' "$readiness_body_file" >/dev/null || {
            echo "::error::Readiness returned HTTP 503 but the JSON contract was incorrect."
            cat "$readiness_body_file" || true
            docker logs "$container_name" || true
            rm -f "$readiness_body_file"
            exit 1
          }
          rm -f "$readiness_body_file"

          echo "PASS: the web process starts and /up is healthy without DB_URL; /ready correctly returns 503."

      - name: Create restricted PostgreSQL application and migration roles
        run: |
          set -eu
          docker run --rm --network host \
            -e PGPASSWORD=raven23_test \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_test -d raven23_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE raven23_migrator_test LOGIN PASSWORD 'raven23_migrator_test'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE raven23_app_test LOGIN PASSWORD 'raven23_app_test'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          GRANT CONNECT ON DATABASE raven23_test TO raven23_migrator_test, raven23_app_test;
          GRANT USAGE, CREATE ON SCHEMA public TO raven23_migrator_test;
          GRANT USAGE ON SCHEMA public TO raven23_app_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE raven23_migrator_test IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO raven23_app_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE raven23_migrator_test IN SCHEMA public
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO raven23_app_test;
          SQL

      - name: Apply PostgreSQL schema with the restricted migration role
        run: |
          set -eu
          docker run --rm --network host \
            -e APP_ENV=testing \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_migrator_test:raven23_migrator_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            --entrypoint php \
            raven23-backend:postgres-test artisan migrate --force

      - name: Verify the application PostgreSQL role cannot administer the database
        shell: bash
        run: |
          set -euo pipefail
          runtime_privileges="$(docker run --rm --network host \
            -e PGPASSWORD=raven23_app_test postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_app_test -d raven23_test -Atc \
              "SELECT CASE WHEN r.rolsuper THEN '1' ELSE '0' END || ':' || CASE WHEN r.rolcreatedb THEN '1' ELSE '0' END || ':' || CASE WHEN r.rolcreaterole THEN '1' ELSE '0' END || ':' || CASE WHEN has_database_privilege(current_user, current_database(), 'CREATE') THEN '1' ELSE '0' END || ':' || CASE WHEN has_schema_privilege(current_user, 'public', 'CREATE') THEN '1' ELSE '0' END || ':' || CASE WHEN has_schema_privilege(current_user, 'public', 'USAGE') THEN '1' ELSE '0' END || ':' || CASE WHEN has_table_privilege(current_user, 'public.users', 'SELECT') THEN '1' ELSE '0' END || ':' || CASE WHEN has_sequence_privilege(current_user, 'public.users_id_seq', 'USAGE') THEN '1' ELSE '0' END FROM pg_roles r WHERE r.rolname = current_user")"
          test "$runtime_privileges" = "0:0:0:0:0:1:1:1" || {
            echo "::error::Unexpected PostgreSQL application-role privileges: $runtime_privileges"
            exit 1
          }

          if docker run --rm --network host -e PGPASSWORD=raven23_app_test postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_app_test -d raven23_test -v ON_ERROR_STOP=1 \
              -c 'CREATE ROLE raven23_escalation_test LOGIN' >/dev/null 2>&1; then
            echo "::error::The application role unexpectedly created another PostgreSQL role."
            exit 1
          fi

          if docker run --rm --network host -e PGPASSWORD=raven23_app_test postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_app_test -d raven23_test -v ON_ERROR_STOP=1 \
              -c 'CREATE DATABASE raven23_escalation_test' >/dev/null 2>&1; then
            echo "::error::The application role unexpectedly created another database."
            exit 1
          fi

          echo "PASS: PostgreSQL app role is non-superuser, cannot create roles/databases/schema objects, and has only application CRUD/sequence access."

      - name: Run PostgreSQL authentication lifecycle suite with restricted application role
        run: |
          set -eu
          docker run --rm --network host \
            -e APP_ENV=testing \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_app_test:raven23_app_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            --entrypoint php \
            raven23-backend:postgres-test artisan test tests/Integration/PostgresAuthLifecycleTest.php

      - name: Apply the schema through an explicit one-off migration role
        run: |
          set -eu
          docker run --rm --network host \
            -e APP_ENV=production \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_migrator_test:raven23_migrator_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            --entrypoint php \
            raven23-backend:ci artisan migrate --force

      - name: Smoke-test the non-root HTTP runtime, liveness and database readiness
        run: |
          set -eu
          container_name=raven23-frankenphp-smoke
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container_name" --network host \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_app_test:raven23_app_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            -e RAVEN23_SOURCE_COMMIT="${GITHUB_SHA}" \
            raven23-backend:ci

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:10000/up >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "::error::FrankenPHP did not serve the liveness endpoint."
            docker logs "$container_name" || true
            exit 1
          fi

          curl --silent --show-error --fail --max-time 5 \
            http://127.0.0.1:10000/ready \
            | jq -e '.success == true and .status == "ready" and .checks.database == "ok" and .checks.schema == "ready"' >/dev/null

          health_body_file="$(mktemp)"
          curl --silent --show-error --fail --max-time 5 \
            --output "$health_body_file" http://127.0.0.1:10000/api/v1/health
          jq -e '.success == true and .database == "connected" and .schema == "ready" and (has("runtime_target") | not) and (has("google_auth") | not) and (has("source_commit") | not)' "$health_body_file" >/dev/null
          rm -f "$health_body_file"

          headers_file="$(mktemp)"
          curl --silent --show-error --dump-header "$headers_file" --output /dev/null --max-time 5 \
            http://127.0.0.1:10000/api/v1/health
          grep -Eiq '^X-Request-ID: [0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' "$headers_file"
          grep -Eiq '^X-Content-Type-Options: nosniff' "$headers_file"
          grep -Eiq '^X-Frame-Options: DENY' "$headers_file"
          grep -Eiq '^Referrer-Policy: strict-origin-when-cross-origin' "$headers_file"
          grep -Eiq '^Permissions-Policy:' "$headers_file"
          grep -Eiq '^Content-Security-Policy:' "$headers_file"
          rm -f "$headers_file"

          runtime_user="$(docker inspect --format '{{.Config.User}}' "$container_name")"
          test "$runtime_user" = "raven:raven" || {
            echo "::error::Expected non-root runtime user raven:raven; got $runtime_user"
            exit 1
          }

          # Create an actual temporary PHP asset in the disposable CI container.
          # The HTTP request must be rejected before the PHP interpreter runs it.
          docker exec --user 0 "$container_name" sh -c "printf '%s\n' '<?php echo \"UNTRUSTED_PHP_WAS_EXECUTED\";' > /var/www/html/public/untrusted-upload.php"

          asset_body_file="$(mktemp)"
          asset_status="$(curl --silent --show-error --output "$asset_body_file" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:10000/untrusted-upload.php)"
          test "$asset_status" = "404" || {
            echo "::error::Direct PHP files in the public tree must be rejected (HTTP $asset_status)."
            cat "$asset_body_file" || true
            rm -f "$asset_body_file"
            exit 1
          }
          if grep -q 'UNTRUSTED_PHP_WAS_EXECUTED' "$asset_body_file"; then
            echo "::error::An uploaded PHP asset was executed by the HTTP runtime."
            rm -f "$asset_body_file"
            exit 1
          fi
          rm -f "$asset_body_file"

          echo "PASS: FrankenPHP HTTP runtime is healthy, non-root, ready, and rejects an actual PHP asset before execution."

      - name: Stop containers
        if: always()
        run: docker rm -f raven23-frankenphp-smoke >/dev/null 2>&1 || true

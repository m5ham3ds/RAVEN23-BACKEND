name: RAVEN23 Backend Docker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and test Laravel API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production PostgreSQL test configuration
        run: |
          set -eu
          if [ -n "${NEON_DB_URL}" ]; then
            echo "PostgreSQL integration tests are enabled."
          else
            echo "::warning::NEON_DB_URL is not configured; only isolated SQLite tests will run."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend image and run authentication suites
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          set -eu
          docker build -t raven23-backend:ci .
          docker build --target postgres-test --build-arg "NEON_DB_URL=${NEON_DB_URL}" -t raven23-backend:postgres-test .

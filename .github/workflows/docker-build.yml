name: RAVEN23 Backend Docker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven23-backend-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build and test portable Laravel runtime
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raven23_test
          POSTGRES_USER: raven23_test
          POSTGRES_PASSWORD: raven23_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raven23_test -d raven23_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      s3mock:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: raven23-ci
        ports:
          - 9090:9090
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Resolve versioned FrankenPHP runtime base digest
        id: frankenphp-base
        shell: bash
        run: |
          set -euo pipefail
          image="dunglas/frankenphp:1.13.6-php8.4-trixie"
          inspect="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$inspect"
          digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          runtime_ref="$(awk '$1 == "FROM" && $0 ~ / AS runtime$/ { print $2; exit }' Dockerfile)"
          expected_ref="$image@$digest"
          if [[ "$runtime_ref" != "$expected_ref" ]]; then
            echo "::error::Dockerfile runtime base $runtime_ref does not match resolved digest $expected_ref"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved runtime base: $image@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Build portable FrankenPHP production image and run SQLite tests
        run: |
          docker build --pull \
            --build-arg RAVEN23_SOURCE_COMMIT="${GITHUB_SHA}" \
            -t raven23-backend:ci .

      - name: Build reusable PostgreSQL integration-test image
        run: docker build --pull --target postgres-test -t raven23-backend:postgres-test .

      - name: Verify private object storage against disposable S3Mock
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          RAVEN23_S3_INTEGRATION_TESTS: 'true'
          RAVEN23_OBJECT_STORAGE_ACCESS_KEY_ID: foo
          RAVEN23_OBJECT_STORAGE_SECRET_ACCESS_KEY: bar
          RAVEN23_OBJECT_STORAGE_REGION: us-east-1
          RAVEN23_OBJECT_STORAGE_BUCKET: raven23-ci
          RAVEN23_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9090
          RAVEN23_OBJECT_STORAGE_USE_PATH_STYLE_ENDPOINT: 'true'
        run: |
          set -eu
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:9090/favicon.ico >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || {
            echo "::error::Disposable S3Mock did not become ready on port 9090."
            exit 1
          }

          docker run --rm --network host \
            -e APP_ENV -e APP_KEY -e DB_CONNECTION -e DB_DATABASE -e DB_URL \
            -e CACHE_STORE -e SESSION_DRIVER -e QUEUE_CONNECTION -e MAIL_MAILER \
            -e RAVEN23_S3_INTEGRATION_TESTS -e RAVEN23_OBJECT_STORAGE_ACCESS_KEY_ID -e RAVEN23_OBJECT_STORAGE_SECRET_ACCESS_KEY \
            -e RAVEN23_OBJECT_STORAGE_REGION -e RAVEN23_OBJECT_STORAGE_BUCKET -e RAVEN23_OBJECT_STORAGE_ENDPOINT \
            -e RAVEN23_OBJECT_STORAGE_USE_PATH_STYLE_ENDPOINT \
            --entrypoint php raven23-backend:postgres-test \
            artisan test tests/Integration/S3PrivateObjectStorageTest.php --display-warnings

      - name: Verify Laravel Pint style on changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              git fetch origin "$GITHUB_BASE_REF"
              mapfile -t changed_php < <(git diff --name-only "origin/$GITHUB_BASE_REF...$GITHUB_SHA" -- '*.php')
              ;;
            push|workflow_dispatch)
              if git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
                mapfile -t changed_php < <(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" -- '*.php')
              else
                mapfile -t changed_php < <(git diff-tree --root -r --no-commit-id --name-only "$GITHUB_SHA" -- '*.php')
              fi
              ;;
            *)
              echo "::error::Unsupported event for changed-file detection: ${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac
          if [ "${#changed_php[@]}" -eq 0 ]; then
            echo "No changed PHP files require Pint validation."
            exit 0
          fi

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint php \
            raven23-backend:postgres-test \
            /opt/raven/vendor/bin/pint --test "${changed_php[@]}"

      - name: Verify the queue worker rejects unsafe process settings
        run: |
          set -eu
          output_file="$(mktemp)"
          if docker run --rm \
            --entrypoint /usr/local/bin/raven23-queue-worker \
            -e QUEUE_CONNECTION=database \
            -e QUEUE_TIMEOUT=90 \
            -e DB_QUEUE_RETRY_AFTER=90 \
            raven23-backend:ci >"$output_file" 2>&1; then
            echo "::error::Queue worker accepted timeout >= retry_after."
            cat "$output_file"
            rm -f "$output_file"
            exit 1
          fi
          grep -Fq "QUEUE_TIMEOUT must be lower than DB_QUEUE_RETRY_AFTER" "$output_file"
          rm -f "$output_file"

          output_file="$(mktemp)"
          if docker run --rm \
            --entrypoint /usr/local/bin/raven23-queue-worker \
            -e QUEUE_CONNECTION=sync \
            raven23-backend:ci >"$output_file" 2>&1; then
            echo "::error::Queue worker accepted the synchronous queue driver."
            cat "$output_file"
            rm -f "$output_file"
            exit 1
          fi
          grep -Fq "requires an asynchronous queue connection" "$output_file"
          rm -f "$output_file"

          output_file="$(mktemp)"
          if docker run --rm \
            --entrypoint /usr/local/bin/raven23-queue-worker \
            -e RAVEN23_PUSH_ENABLED=true \
            -e RAVEN23_PUSH_PROVIDER=fcm \
            -e QUEUE_WORKER_QUEUES=mail,default \
            raven23-backend:ci >"$output_file" 2>&1; then
            echo "::error::Queue worker accepted enabled push without listening to the push queue."
            cat "$output_file"
            rm -f "$output_file"
            exit 1
          fi
          grep -Fq "RAVEN23_PUSH_ENABLED=true requires QUEUE_WORKER_QUEUES to include push" "$output_file"
          rm -f "$output_file"

          output_file="$(mktemp)"
          if docker run --rm \
            --entrypoint /usr/local/bin/raven23-queue-worker \
            -e RAVEN23_PUSH_ENABLED=true \
            -e RAVEN23_PUSH_PROVIDER=fcm \
            -e QUEUE_WORKER_QUEUES=mail,push,default \
            -e QUEUE_CONNECTION=sync \
            raven23-backend:ci >"$output_file" 2>&1; then
            echo "::error::Queue worker accepted the synchronous driver with push enabled."
            cat "$output_file"
            rm -f "$output_file"
            exit 1
          fi
          grep -Fq "requires an asynchronous queue connection" "$output_file"
          rm -f "$output_file"
      - name: Verify the Wellness controller Pint baseline
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint php \
            raven23-backend:postgres-test \
            /opt/raven/vendor/bin/pint --test app/Http/Controllers/Api/WellnessSyncController.php

      - name: Verify production refuses APP_DEBUG=true
        run: |
          set -eu
          if docker run --rm --entrypoint /usr/local/bin/raven23-entrypoint \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e APP_ENV=production -e APP_DEBUG=true \
            raven23-backend:ci php -v; then
            echo "::error::Production entrypoint accepted APP_DEBUG=true."
            exit 1
          fi
          echo "PASS: production entrypoint rejects APP_DEBUG=true."

      - name: Prove web startup and liveness do not require a database
        run: |
          set -eu
          container_name=raven23-no-database-startup
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container_name" --network host \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=1 \
            -e DB_DATABASE=raven23_unavailable_test \
            -e DB_USERNAME=raven23_unavailable_test \
            -e DB_PASSWORD=unavailable \
            -e RAVEN23_SOURCE_COMMIT="${GITHUB_SHA}" \
            raven23-backend:ci

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:10000/up >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || {
            echo "::error::Web startup/liveness incorrectly depends on a database connection."
            docker logs "$container_name" || true
            exit 1
          }

          readiness_body_file="$(mktemp)"
          readiness_status="$(curl --silent --show-error --output "$readiness_body_file" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:10000/ready)"
          test "$readiness_status" = "503" || {
            echo "::error::Expected readiness HTTP 503 with PostgreSQL unreachable on 127.0.0.1:1; got $readiness_status."
            echo "Readiness response body:"
            cat "$readiness_body_file" || true
            echo "Container logs:"
            docker logs "$container_name" || true
            rm -f "$readiness_body_file"
            exit 1
          }
          jq -e '.success == false and .status == "not_ready" and .checks.application == "ok" and .checks.database == "unavailable" and .checks.schema == "unknown"' "$readiness_body_file" >/dev/null || {
            echo "::error::Readiness returned HTTP 503 but the JSON contract was incorrect."
            cat "$readiness_body_file" || true
            docker logs "$container_name" || true
            rm -f "$readiness_body_file"
            exit 1
          }
          rm -f "$readiness_body_file"

          echo "PASS: the web process starts and /up is healthy without DB_URL; /ready correctly returns 503."

      - name: Create restricted PostgreSQL application and migration roles
        run: |
          set -eu
          docker run --rm -i --network host \
            -e PGPASSWORD=raven23_test \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_test -d raven23_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE raven23_migrator_test LOGIN PASSWORD 'raven23_migrator_test'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE raven23_app_test LOGIN PASSWORD 'raven23_app_test'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          GRANT CONNECT ON DATABASE raven23_test TO raven23_migrator_test, raven23_app_test;
          GRANT USAGE, CREATE ON SCHEMA public TO raven23_migrator_test;
          GRANT USAGE ON SCHEMA public TO raven23_app_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE raven23_migrator_test IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO raven23_app_test;
          ALTER DEFAULT PRIVILEGES FOR ROLE raven23_migrator_test IN SCHEMA public
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO raven23_app_test;
          SQL

      - name: Apply PostgreSQL schema with the restricted migration role
        run: |
          set -eu
          docker run --rm --network host \
            -e APP_ENV=testing \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_migrator_test:raven23_migrator_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            --entrypoint php \
            raven23-backend:postgres-test artisan migrate --force

      - name: Verify the application PostgreSQL role cannot administer the database
        shell: bash
        run: |
          set -euo pipefail
          runtime_privileges="$(docker run --rm --network host \
            -e PGPASSWORD=raven23_app_test postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_app_test -d raven23_test -Atc \
              "SELECT CASE WHEN r.rolsuper THEN '1' ELSE '0' END || ':' || CASE WHEN r.rolcreatedb THEN '1' ELSE '0' END || ':' || CASE WHEN r.rolcreaterole THEN '1' ELSE '0' END || ':' || CASE WHEN has_database_privilege(current_user, current_database(), 'CREATE') THEN '1' ELSE '0' END || ':' || CASE WHEN has_schema_privilege(current_user, 'public', 'CREATE') THEN '1' ELSE '0' END || ':' || CASE WHEN has_schema_privilege(current_user, 'public', 'USAGE') THEN '1' ELSE '0' END || ':' || CASE WHEN has_table_privilege(current_user, 'public.users', 'SELECT') THEN '1' ELSE '0' END || ':' || CASE WHEN has_sequence_privilege(current_user, 'public.users_id_seq', 'USAGE') THEN '1' ELSE '0' END FROM pg_roles r WHERE r.rolname = current_user")"
          test "$runtime_privileges" = "0:0:0:0:0:1:1:1" || {
            echo "::error::Unexpected PostgreSQL application-role privileges: $runtime_privileges"
            exit 1
          }

          if docker run --rm --network host -e PGPASSWORD=raven23_app_test postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_app_test -d raven23_test -v ON_ERROR_STOP=1 \
              -c 'CREATE ROLE raven23_escalation_test LOGIN' >/dev/null 2>&1; then
            echo "::error::The application role unexpectedly created another PostgreSQL role."
            exit 1
          fi

          if docker run --rm --network host -e PGPASSWORD=raven23_app_test postgres:16-alpine \
            psql -h 127.0.0.1 -U raven23_app_test -d raven23_test -v ON_ERROR_STOP=1 \
              -c 'CREATE DATABASE raven23_escalation_test' >/dev/null 2>&1; then
            echo "::error::The application role unexpectedly created another database."
            exit 1
          fi

          echo "PASS: PostgreSQL app role is non-superuser, cannot create roles/databases/schema objects, and has only application CRUD/sequence access."

      - name: Run PostgreSQL auth and media-sync integration suites with restricted application role
        run: |
          set -eu
          docker run --rm --network host \
            -e APP_ENV=testing \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_app_test:raven23_app_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            --entrypoint php \
            raven23-backend:postgres-test artisan test tests/Integration

      - name: Rehearse encrypted PostgreSQL backup and restore with synthetic rows
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: raven23_test
          PGPASSWORD: raven23_test
          PGDATABASE: raven23_test
          RAVEN23_ALLOW_DISPOSABLE_PG_REHEARSAL: 'yes'
          RAVEN23_REHEARSAL_ID: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -eu
          evidence_dir="$RUNNER_TEMP/raven23-phase12-rehearsal"
          mkdir -p "$evidence_dir"
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$evidence_dir:/evidence" \
            --workdir /workspace \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -e RAVEN23_ALLOW_DISPOSABLE_PG_REHEARSAL -e RAVEN23_REHEARSAL_ID \
            -e REPORT_PATH=/evidence/synthetic-restore-report.json \
            --entrypoint sh \
            postgres:16-alpine -c 'apk add --no-cache openssl >/dev/null && exec sh scripts/postgres-backup-restore-rehearsal.sh'
          jq -e '.result == "passed" and .restore.rowsAndSchemaMatchedSource == true and .safety.productionDatabaseUsed == false' \
            "$evidence_dir/synthetic-restore-report.json" >/dev/null
          {
            echo "## Phase12 synthetic PostgreSQL backup/restore rehearsal"
            echo "- Encrypted custom-format backup decrypted with a matching SHA-256 payload checksum."
            echo "- A separate disposable database was restored and verified for rows, constraints and indexes."
            echo "- Synthetic-only rehearsal: no production data, credentials, database or cutover."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rehearse full PostgreSQL CI schema and data backup/restore
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: raven23_test
          PGPASSWORD: raven23_test
          PGDATABASE: raven23_test
          RAVEN23_ALLOW_DISPOSABLE_PG_REHEARSAL: 'yes'
        run: |
          set -eu
          RAVEN23_REHEARSAL_ID="$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT"
          export RAVEN23_REHEARSAL_ID
          evidence_dir="$RUNNER_TEMP/raven23-phase12-rehearsal"
          mkdir -p "$evidence_dir"
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$evidence_dir:/evidence" \
            --workdir /workspace \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -e RAVEN23_ALLOW_DISPOSABLE_PG_REHEARSAL \
            -e RAVEN23_REHEARSAL_ID \
            -e RAVEN23_REPOSITORY_ROOT=/workspace \
            -e REPORT_PATH=/evidence/full-schema-restore-report.json \
            --entrypoint sh \
            postgres:16-alpine -c 'apk add --no-cache openssl >/dev/null && exec sh scripts/postgres-full-schema-restore-rehearsal.sh'
          jq -e '.result == "passed" and .restore.tableInventoriesMatched == true and .restore.perTableRowCountsAndContentFingerprintsMatched == true and .restore.sequenceCurrentValuesAndIsCalledMatched == true and .safety.productionDatabaseUsed == false and .safety.rowValuesIncludedInArtifact == false' \
            "$evidence_dir/full-schema-restore-report.json" >/dev/null
          {
            echo "## Phase12 full PostgreSQL schema/data rehearsal"
            echo "- Backed up and restored the disposable CI database after the full Laravel migration set was applied."
            echo "- Compared public table inventory, columns, constraints, indexes, sequence definitions and last_value/is_called state, triggers, views, row counts and per-table content fingerprints."
            echo "- Evidence includes aggregate counts and hashes only; no row values, production credentials, production database or cutover."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase12 synthetic backup/restore evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raven23-phase12-synthetic-restore-${{ github.sha }}
          path: |
            ${{ runner.temp }}/raven23-phase12-rehearsal/synthetic-restore-report.json
            ${{ runner.temp }}/raven23-phase12-rehearsal/full-schema-restore-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply the schema through an explicit one-off migration role
        run: |
          set -eu
          docker run --rm --network host \
            -e APP_ENV=production \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_migrator_test:raven23_migrator_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            --entrypoint php \
            raven23-backend:ci artisan migrate --force

      - name: Smoke-test the non-root HTTP runtime, liveness and database readiness
        run: |
          set -eu
          container_name=raven23-frankenphp-smoke
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container_name" --network host \
            -e APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            -e DB_CONNECTION=pgsql \
            -e DB_SSLMODE=disable \
            -e DB_URL='postgresql://raven23_app_test:raven23_app_test@127.0.0.1:5432/raven23_test?sslmode=disable' \
            -e RAVEN23_SOURCE_COMMIT="${GITHUB_SHA}" \
            raven23-backend:ci

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:10000/up >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "::error::FrankenPHP did not serve the liveness endpoint."
            docker logs "$container_name" || true
            exit 1
          fi

          curl --silent --show-error --fail --max-time 5 \
            http://127.0.0.1:10000/ready \
            | jq -e '.success == true and .status == "ready" and .checks.database == "ok" and .checks.schema == "ready"' >/dev/null

          health_body_file="$(mktemp)"
          curl --silent --show-error --fail --max-time 5 \
            --output "$health_body_file" http://127.0.0.1:10000/api/v1/health
          jq -e '.success == true and .database == "connected" and .schema == "ready" and (has("runtime_target") | not) and (has("google_auth") | not) and (has("source_commit") | not)' "$health_body_file" >/dev/null
          rm -f "$health_body_file"

          headers_file="$(mktemp)"
          curl --silent --show-error --dump-header "$headers_file" --output /dev/null --max-time 5 \
            http://127.0.0.1:10000/api/v1/health
          grep -Eiq '^X-Request-ID: [0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' "$headers_file"
          grep -Eiq '^X-Content-Type-Options: nosniff' "$headers_file"
          grep -Eiq '^X-Frame-Options: DENY' "$headers_file"
          grep -Eiq '^Referrer-Policy: strict-origin-when-cross-origin' "$headers_file"
          grep -Eiq '^Permissions-Policy:' "$headers_file"
          grep -Eiq '^Content-Security-Policy:' "$headers_file"
          rm -f "$headers_file"

          runtime_user="$(docker inspect --format '{{.Config.User}}' "$container_name")"
          test "$runtime_user" = "raven:raven" || {
            echo "::error::Expected non-root runtime user raven:raven; got $runtime_user"
            exit 1
          }

          # Create an actual temporary PHP asset in the disposable CI container.
          # The HTTP request must be rejected before the PHP interpreter runs it.
          docker exec --user 0 "$container_name" sh -c "printf '%s\n' '<?php echo \"UNTRUSTED_PHP_WAS_EXECUTED\";' > /var/www/html/public/untrusted-upload.php"

          asset_body_file="$(mktemp)"
          asset_status="$(curl --silent --show-error --output "$asset_body_file" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:10000/untrusted-upload.php)"
          test "$asset_status" = "404" || {
            echo "::error::Direct PHP files in the public tree must be rejected (HTTP $asset_status)."
            cat "$asset_body_file" || true
            rm -f "$asset_body_file"
            exit 1
          }
          if grep -q 'UNTRUSTED_PHP_WAS_EXECUTED' "$asset_body_file"; then
            echo "::error::An uploaded PHP asset was executed by the HTTP runtime."
            rm -f "$asset_body_file"
            exit 1
          fi
          rm -f "$asset_body_file"

          echo "PASS: FrankenPHP HTTP runtime is healthy, non-root, ready, and rejects an actual PHP asset before execution."

      - name: Stop containers
        if: always()
        run: docker rm -f raven23-frankenphp-smoke >/dev/null 2>&1 || true

      - name: Rebuild previous known-good release and rehearse isolated traffic rollback
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: rollback-rehearsal
        env:
          ROLLBACK_TARGET_FILE: phases/release/rollback-target.json
        run: bash scripts/rollback-rehearsal.sh

      - name: Package the tested image with SHA-bound provenance and SBOM
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: release-evidence
        env:
          BASE_IMAGE: ${{ steps.frankenphp-base.outputs.image }}
          BASE_DIGEST: ${{ steps.frankenphp-base.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/release-evidence"
          mkdir -p "$evidence_dir"

          image_tag="raven23-backend:sha-$GITHUB_SHA"
          docker tag raven23-backend:ci "$image_tag"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_tag")"
          embedded_commit="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image_tag" | sed -n 's/^RAVEN23_SOURCE_COMMIT=//p')"
          test "$embedded_commit" = "$GITHUB_SHA" || {
            echo "::error::Image source commit does not match the workflow SHA."
            exit 1
          }
          test "$(docker image inspect --format '{{.Id}}' raven23-backend:ci)" = "$image_id"

          archive="$evidence_dir/raven23-backend-$GITHUB_SHA.docker.tar"
          sbom="$evidence_dir/raven23-backend.cdx.json"
          provenance="$evidence_dir/raven23-backend.provenance.json"
          docker save --output "$archive" "$image_tag"
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$evidence_dir:/out" \
            aquasec/trivy:0.76.2 \
            image --format cyclonedx --output /out/raven23-backend.cdx.json "$image_tag"
          test -s "$sbom"
          sbom_sha="$(sha256sum "$sbom" | awk '{print $1}')"

          dockerfile_sha="$(sha256sum Dockerfile | awk '{print $1}')"
          composer_json_sha="$(sha256sum composer.json | awk '{print $1}')"
          composer_lock_sha="$(sha256sum composer.lock | awk '{print $1}')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg image_tag "$image_tag" \
            --arg image_config_digest "$image_id" \
            --arg image_platform "$image_platform" \
            --arg base_image "$BASE_IMAGE" \
            --arg base_digest "$BASE_DIGEST" \
            --arg dockerfile_sha256 "$dockerfile_sha" \
            --arg composer_json_sha256 "$composer_json_sha" \
            --arg composer_lock_sha256 "$composer_lock_sha" \
            --arg archive_file "$(basename "$archive")" \
            --arg archive_sha256 "$archive_sha" \
            --arg sbom_file "$(basename "$sbom")" \
            --arg sbom_sha256 "$sbom_sha" \
            '{
              schemaVersion: 1,
              kind: "raven23.tested-container-build-provenance",
              source: {repository: $repository, commit: $source_commit, runId: $run_id, runAttempt: $run_attempt},
              image: {localImmutableTag: $image_tag, configDigest: $image_config_digest, platform: $image_platform, sourceCommitVerifiedInImageEnvironment: $source_commit},
              materials: {runtimeBase: {image: $base_image, digest: $base_digest}, dockerfile: {sha256: $dockerfile_sha256}, composerManifest: {sha256: $composer_json_sha256}, composerLock: {sha256: $composer_lock_sha256}},
              artifacts: {dockerArchive: {file: $archive_file, sha256: $archive_sha256}, sbom: {file: $sbom_file, format: "CycloneDX JSON", sha256: $sbom_sha256}},
              registry: {published: false, note: "No registry manifest digest is claimed; the local image config digest and exact archive SHA-256 identify the tested image artifact."}
            }' > "$provenance"

          printf 'image_config_digest=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          printf 'image_platform=%s\n' "$image_platform" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"
          printf 'sbom_sha256=%s\n' "$sbom_sha" >> "$GITHUB_OUTPUT"
          {
            printf '## Tested image release evidence\n\n'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Immutable local tag: `%s`\n' "$image_tag"
            printf -- '- Docker image config digest: `%s`\n' "$image_id"
            printf -- '- Platform: `%s`\n' "$image_platform"
            printf -- '- Docker archive SHA-256: `%s`\n' "$archive_sha"
            printf -- '- CycloneDX SBOM SHA-256: `%s`\n' "$sbom_sha"
            printf -- '- Runtime base: `%s@%s`\n' "$BASE_IMAGE" "$BASE_DIGEST"
            printf -- '- No image was pushed to a container registry.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned release inputs for the trusted attestation job
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raven23-release-inputs-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Summarize validation and release-evidence boundary
        if: always()
        run: |
          {
            echo "## Docker validation trust boundary"
            echo "- Validation job permissions: contents: read only."
            echo "- Pull requests never receive OIDC or artifact-attestation permissions."
            if [[ "${GITHUB_REF}" == "refs/heads/main" && ( "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ) ]]; then
              echo "- Unsigned release inputs were uploaded for the separate trusted-main attestation job."
            else
              echo "- Release attestation is not eligible for this event/ref."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  attest-release:
    name: Sign trusted main release evidence
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download unsigned release inputs from this workflow run
        uses: actions/download-artifact@v8.0.2
        with:
          name: raven23-release-inputs-${{ github.sha }}
          path: release-evidence

      - name: Verify source, rollback, hashes and rehearsal before signing
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          current="release-evidence/raven23-backend.provenance.json"
          rollback="release-evidence/raven23-backend-rollback.provenance.json"
          rehearsal="release-evidence/rollback-rehearsal.json"
          target="phases/release/rollback-target.json"

          for file in "$current" "$rollback" "$rehearsal" "$target"; do
            test -s "$file" || {
              echo "::error::Required release evidence file is missing: $file"
              exit 1
            }
          done

          jq -e \
            --arg repo "$EXPECTED_REPOSITORY" \
            --arg sha "$EXPECTED_SHA" \
            --arg run "$EXPECTED_RUN_ID" \
            --arg attempt "$EXPECTED_RUN_ATTEMPT" \
            '.schemaVersion == 1
             and .kind == "raven23.tested-container-build-provenance"
             and .source.repository == $repo
             and .source.commit == $sha
             and .source.runId == $run
             and .source.runAttempt == $attempt
             and .image.sourceCommitVerifiedInImageEnvironment == $sha
             and .registry.published == false' "$current" >/dev/null

          jq -e \
            --arg repo "$EXPECTED_REPOSITORY" \
            --arg sha "$EXPECTED_SHA" \
            --arg run "$EXPECTED_RUN_ID" \
            '.schemaVersion == 1
             and .kind == "raven23.rollback-container-build-provenance"
             and .source.repository == $repo
             and .builder.workflowCommit == $sha
             and .builder.runId == $run' "$rollback" >/dev/null

          rollback_sha="$(jq -er '.source.commit' "$rollback")"
          expected_rollback_sha="$(jq -er '.rollbackTarget.commit' "$target")"
          test "$rollback_sha" = "$expected_rollback_sha"
          test "$rollback_sha" != "$EXPECTED_SHA"

          current_archive_expected="raven23-backend-$EXPECTED_SHA.docker.tar"
          rollback_archive_expected="raven23-backend-rollback-$rollback_sha.docker.tar"
          current_archive="$(jq -er '.artifacts.dockerArchive.file' "$current")"
          current_sbom="$(jq -er '.artifacts.sbom.file' "$current")"
          rollback_archive="$(jq -er '.artifacts.dockerArchive.file' "$rollback")"
          rollback_sbom="$(jq -er '.artifacts.sbom.file' "$rollback")"

          test "$current_archive" = "$current_archive_expected"
          test "$current_sbom" = "raven23-backend.cdx.json"
          test "$rollback_archive" = "$rollback_archive_expected"
          test "$rollback_sbom" = "raven23-backend-rollback.cdx.json"

          for file in \
            "release-evidence/$current_archive" \
            "release-evidence/$current_sbom" \
            "release-evidence/$rollback_archive" \
            "release-evidence/$rollback_sbom"; do
            test -s "$file" || {
              echo "::error::Release archive or SBOM is missing/empty: $file"
              exit 1
            }
          done

          current_archive_sha="$(jq -er '.artifacts.dockerArchive.sha256' "$current")"
          current_sbom_sha="$(jq -er '.artifacts.sbom.sha256' "$current")"
          rollback_archive_sha="$(jq -er '.artifacts.dockerArchive.sha256' "$rollback")"
          rollback_sbom_sha="$(jq -er '.artifacts.sbom.sha256' "$rollback")"

          printf '%s  %s\n' "$current_archive_sha" "release-evidence/$current_archive" | sha256sum --check
          printf '%s  %s\n' "$current_sbom_sha" "release-evidence/$current_sbom" | sha256sum --check
          printf '%s  %s\n' "$rollback_archive_sha" "release-evidence/$rollback_archive" | sha256sum --check
          printf '%s  %s\n' "$rollback_sbom_sha" "release-evidence/$rollback_sbom" | sha256sum --check

          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array") and (.components | length > 0)' "release-evidence/$current_sbom" >/dev/null
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array") and (.components | length > 0)' "release-evidence/$rollback_sbom" >/dev/null

          jq -e \
            --arg current "$EXPECTED_SHA" \
            --arg rollback "$rollback_sha" \
            '.kind == "raven23.isolated-rollback-rehearsal"
             and .result == "passed"
             and .currentRelease.commit == $current
             and .rollbackTarget.commit == $rollback
             and .trafficSwitch.simulatedFailureStatus == 502
             and .trafficSwitch.postRollbackHttpStatus == 200
             and .trafficSwitch.outcome == "PASS"
             and .safety.productionDatabaseUsed == false
             and .safety.productionSecretsUsed == false
             and .safety.deploymentPerformed == false
             and .safety.registryPushPerformed == false' "$rehearsal" >/dev/null

          current_digest="$(jq -er '.image.configDigest' "$current")"
          rollback_digest="$(jq -er '.image.configDigest' "$rollback")"
          test "$current_digest" = "$(jq -er '.currentRelease.configDigest' "$rehearsal")"
          test "$rollback_digest" = "$(jq -er '.rollbackTarget.configDigest' "$rehearsal")"

          echo "PASS: exact run/SHA, rollback target, four SHA-256 values, CycloneDX SBOMs and isolated rollback evidence verified before signing."
          {
            echo "## Pre-attestation evidence validation"
            echo "- Source commit and workflow run identity matched."
            echo "- Current and rollback Docker archives/SBOMs matched their recorded SHA-256 values."
            echo "- Both CycloneDX SBOMs are non-empty."
            echo "- Rollback rehearsal proved HTTP 200 → 502 → 200 without production resources."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate signed SLSA build provenance attestation for the tested image archive
        id: image-provenance
        uses: actions/attest@v4
        with:
          subject-path: release-evidence/raven23-backend-${{ github.sha }}.docker.tar
          show-summary: true

      - name: Generate signed SBOM attestation for the tested image archive
        id: image-sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: release-evidence/raven23-backend-${{ github.sha }}.docker.tar
          sbom-path: release-evidence/raven23-backend.cdx.json
          show-summary: true

      - name: Resolve rollback metadata for signed attestations
        id: rollback-meta
        shell: bash
        run: |
          set -euo pipefail
          rollback_sha="$(jq -er '.source.commit' release-evidence/raven23-backend-rollback.provenance.json)"
          [[ "$rollback_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$rollback_sha" >> "$GITHUB_OUTPUT"

      - name: Generate signed SLSA build provenance attestation for the rollback image archive
        id: rollback-image-provenance
        uses: actions/attest@v4
        with:
          subject-path: release-evidence/raven23-backend-rollback-${{ steps.rollback-meta.outputs.sha }}.docker.tar
          show-summary: true

      - name: Generate signed SBOM attestation for the rollback image archive
        id: rollback-image-sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: release-evidence/raven23-backend-rollback-${{ steps.rollback-meta.outputs.sha }}.docker.tar
          sbom-path: release-evidence/raven23-backend-rollback.cdx.json
          show-summary: true

      - name: Collect signed image and rollback attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.image-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.image-sbom-attestation.outputs.bundle-path }}
          ROLLBACK_PROVENANCE_BUNDLE: ${{ steps.rollback-image-provenance.outputs.bundle-path }}
          ROLLBACK_SBOM_BUNDLE: ${{ steps.rollback-image-sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          test -s "$ROLLBACK_PROVENANCE_BUNDLE"
          test -s "$ROLLBACK_SBOM_BUNDLE"
          cp "$PROVENANCE_BUNDLE" release-evidence/image-provenance.sigstore.json
          cp "$SBOM_BUNDLE" release-evidence/image-sbom.sigstore.json
          cp "$ROLLBACK_PROVENANCE_BUNDLE" release-evidence/rollback-image-provenance.sigstore.json
          cp "$ROLLBACK_SBOM_BUNDLE" release-evidence/rollback-image-sbom.sigstore.json

      - name: Generate immutable release manifest
        id: release-manifest
        env:
          ROLLBACK_TARGET_FILE: phases/release/rollback-target.json
          IMAGE_PROVENANCE_ID: ${{ steps.image-provenance.outputs.attestation-id }}
          IMAGE_PROVENANCE_URL: ${{ steps.image-provenance.outputs.attestation-url }}
          IMAGE_SBOM_ID: ${{ steps.image-sbom-attestation.outputs.attestation-id }}
          IMAGE_SBOM_URL: ${{ steps.image-sbom-attestation.outputs.attestation-url }}
          ROLLBACK_PROVENANCE_ID: ${{ steps.rollback-image-provenance.outputs.attestation-id }}
          ROLLBACK_PROVENANCE_URL: ${{ steps.rollback-image-provenance.outputs.attestation-url }}
          ROLLBACK_SBOM_ID: ${{ steps.rollback-image-sbom-attestation.outputs.attestation-id }}
          ROLLBACK_SBOM_URL: ${{ steps.rollback-image-sbom-attestation.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          current="release-evidence/raven23-backend.provenance.json"
          rollback="release-evidence/raven23-backend-rollback.provenance.json"
          rollback_validation="$(jq -c '.rollbackTarget.validation' "$ROLLBACK_TARGET_FILE")"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg current_image "$(jq -er '.image.localImmutableTag' "$current")" \
            --arg current_digest "$(jq -er '.image.configDigest' "$current")" \
            --arg current_platform "$(jq -er '.image.platform' "$current")" \
            --arg current_archive "$(jq -er '.artifacts.dockerArchive.file' "$current")" \
            --arg current_archive_sha "$(jq -er '.artifacts.dockerArchive.sha256' "$current")" \
            --arg current_sbom "$(jq -er '.artifacts.sbom.file' "$current")" \
            --arg current_sbom_sha "$(jq -er '.artifacts.sbom.sha256' "$current")" \
            --arg old_commit "$(jq -er '.source.commit' "$rollback")" \
            --arg old_image "$(jq -er '.image.tag' "$rollback")" \
            --arg old_digest "$(jq -er '.image.configDigest' "$rollback")" \
            --arg old_platform "$(jq -er '.image.platform' "$rollback")" \
            --arg old_archive "$(jq -er '.artifacts.dockerArchive.file' "$rollback")" \
            --arg old_archive_sha "$(jq -er '.artifacts.dockerArchive.sha256' "$rollback")" \
            --arg old_sbom "$(jq -er '.artifacts.sbom.file' "$rollback")" \
            --arg old_sbom_sha "$(jq -er '.artifacts.sbom.sha256' "$rollback")" \
            --arg old_sbom_generator "$(jq -er '.artifacts.sbom.generator' "$rollback")" \
            --arg old_sbom_component_count "$(jq -er '.artifacts.sbom.componentCount' "$rollback")" \
            --argjson old_validation "$rollback_validation" \
            --arg cur_prov_id "$IMAGE_PROVENANCE_ID" --arg cur_prov_url "$IMAGE_PROVENANCE_URL" \
            --arg cur_sbom_id "$IMAGE_SBOM_ID" --arg cur_sbom_url "$IMAGE_SBOM_URL" \
            --arg old_prov_id "$ROLLBACK_PROVENANCE_ID" --arg old_prov_url "$ROLLBACK_PROVENANCE_URL" \
            --arg old_sbom_id "$ROLLBACK_SBOM_ID" --arg old_sbom_url "$ROLLBACK_SBOM_URL" \
            --slurpfile rehearsal release-evidence/rollback-rehearsal.json \
            '{
              schemaVersion:1,kind:"raven23.immutable-release-manifest",
              source:{repository:$repository,branch:"main",commit:$commit,workflowRunId:$run,workflowRunAttempt:$attempt},
              release:{image:$current_image,configDigest:$current_digest,platform:$current_platform,dockerArchive:{file:$current_archive,sha256:$current_archive_sha},sbom:{file:$current_sbom,format:"CycloneDX JSON",sha256:$current_sbom_sha}},
              rollback:{sourceCommit:$old_commit,image:$old_image,configDigest:$old_digest,platform:$old_platform,dockerArchive:{file:$old_archive,sha256:$old_archive_sha},sbom:{file:$old_sbom,format:"CycloneDX JSON",generator:$old_sbom_generator,componentCount:($old_sbom_component_count|tonumber),sha256:$old_sbom_sha},priorCiValidation:$old_validation,rehearsal:$rehearsal[0]},
              attestations:{
                releaseProvenance:{id:$cur_prov_id,url:$cur_prov_url,bundle:"image-provenance.sigstore.json"},
                releaseSbom:{id:$cur_sbom_id,url:$cur_sbom_url,bundle:"image-sbom.sigstore.json"},
                rollbackProvenance:{id:$old_prov_id,url:$old_prov_url,bundle:"rollback-image-provenance.sigstore.json"},
                rollbackSbom:{id:$old_sbom_id,url:$old_sbom_url,bundle:"rollback-image-sbom.sigstore.json"}
              },
              publication:{registryPush:false,productionDeployment:false,productionDatabaseTouched:false}
            }' > release-evidence/release-manifest.json

          jq -e \
            '.schemaVersion == 1
             and .release.configDigest
             and .rollback.configDigest
             and .rollback.rehearsal.result == "passed"
             and .attestations.releaseProvenance.url
             and .attestations.releaseSbom.url
             and .attestations.rollbackProvenance.url
             and .attestations.rollbackSbom.url' release-evidence/release-manifest.json >/dev/null

      - name: Sign the immutable release manifest
        id: release-manifest-attestation
        uses: actions/attest@v4
        with:
          subject-path: release-evidence/release-manifest.json
          show-summary: true

      - name: Finalize and verify immutable release evidence
        env:
          MANIFEST_BUNDLE: ${{ steps.release-manifest-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$MANIFEST_BUNDLE"
          cp "$MANIFEST_BUNDLE" release-evidence/release-manifest.sigstore.json
          (
            cd release-evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "Release manifest signature: ${{ steps.release-manifest-attestation.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release and rollback evidence
        id: release-evidence-upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raven23-release-bundle-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish release bundle location
        run: |
          {
            echo "## Immutable release and rollback bundle"
            echo "- Artifact ID: ${{ steps.release-evidence-upload.outputs.artifact-id }}"
            echo "- Artifact URL: ${{ steps.release-evidence-upload.outputs.artifact-url }}"
            echo "- Artifact digest: ${{ steps.release-evidence-upload.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

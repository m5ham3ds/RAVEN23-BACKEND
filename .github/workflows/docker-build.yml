name: RAVEN23 Backend Docker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and test Laravel API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required PostgreSQL integration secret
        run: |
          set -eu
          test -n "${NEON_DB_URL}" || { echo "::error::Missing repository secret NEON_DB_URL; PostgreSQL integration tests cannot run."; exit 1; }
          echo "Neon PostgreSQL integration secret is present. Its value is not displayed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: |
          set -eu
          docker build -t raven23-backend:ci .

      - name: Run PostgreSQL integration suite with isolated secret mount
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          set -eu
          docker build --secret id=neon_db_url,env=NEON_DB_URL --target postgres-test -t raven23-backend:postgres-test .

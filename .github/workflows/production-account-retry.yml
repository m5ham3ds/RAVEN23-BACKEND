name: RAVEN23 Production Registration Retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-account-retry.yml"

permissions:
  contents: read

concurrency:
  group: raven23-production-registration-retry
  cancel-in-progress: false

jobs:
  account-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ROOT: https://raven23-backend.onrender.com/api/v1
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Wait for the exact live deployment
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base=os.environ["API_ROOT"].rstrip("/")
          expected=os.environ["EXPECTED_COMMIT"][:12]
          end=time.monotonic()+15*60
          last=None
          while time.monotonic()<end:
              req=urllib.request.Request(base+"/health",headers={"Accept":"application/json","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: status,raw=r.status,r.read()
              except urllib.error.HTTPError as e: status,raw=e.code,e.read()
              except Exception as e:
                  last=type(e).__name__; time.sleep(10); continue
              try: p=json.loads(raw.decode()) if raw else {}
              except Exception: p={}
              live=(p.get("runtime_target") or {}).get("render_git_commit")
              last={"status":status,"database":p.get("database"),"schema":p.get("schema"),"commit":live}
              if status==200 and p.get("success") is True and p.get("database")=="connected" and p.get("schema")=="ready" and live==expected:
                  print("PASS: expected deployment and production PostgreSQL are healthy."); break
              time.sleep(10)
          else: raise SystemExit(f"Production deployment not ready: {last!r}")
          PY

      - name: Register, login, read profile and remove the synthetic production account
        run: |
          python3 - <<'PY'
          import json, os, secrets, uuid, urllib.request, urllib.error
          base=os.environ["API_ROOT"].rstrip("/")
          suffix=uuid.uuid4().hex[:16]
          email=f"raven-live-{suffix}@example.test"
          password="Rav!" + secrets.token_urlsafe(20)
          device={"device_id":str(uuid.uuid4()),"device_name":"RAVEN23 temporary CI","platform":"android"}
          username=f"raven_live_{suffix}"
          tokens=[]
          attempted=False
          removed=False
          failure=None

          def call(method,path,payload=None,token=None):
              data=json.dumps(payload).encode() if payload is not None else None
              h={"Accept":"application/json","Cache-Control":"no-cache, no-store","User-Agent":"RAVEN23-production-account-retry"}
              if data is not None: h["Content-Type"]="application/json"
              if token: h["Authorization"]="Bearer "+token
              req=urllib.request.Request(base+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: status,raw=r.status,r.read()
              except urllib.error.HTTPError as e: status,raw=e.code,e.read()
              try: body=json.loads(raw.decode()) if raw else {}
              except Exception: body={}
              return status,body

          def deleted():
              return call("POST","/auth/login",{"email":email,"password":password})[0]==401

          def cleanup():
              for t in reversed(tokens):
                  try:
                      s,_=call("DELETE","/user/account",{},t)
                      if s==200 and deleted(): return True
                  except Exception: pass
              try:
                  s,b=call("POST","/auth/login",{"email":email,"password":password,**device})
                  t=b.get("token")
                  if s==200 and isinstance(t,str) and t:
                      tokens.append(t)
                      return call("DELETE","/user/account",{},t)[0]==200 and deleted()
                  return s==401 and deleted()
              except Exception: return False

          try:
              attempted=True
              s,b=call("POST","/auth/register",{
                  "name":"RAVEN23 Production Test",
                  "email":email,"username":username,"password":password,**device
              })
              if s!=201:
                  print("REGISTER RESPONSE:",json.dumps({"status":s,"message":b.get("message"),"fields":sorted(b.keys())},sort_keys=True))
              if s!=201 or b.get("success") is not True: raise RuntimeError(f"register HTTP {s}")
              uid=(b.get("user") or {}).get("id")
              t=b.get("token")
              if not uid or not isinstance(t,str) or not t: raise RuntimeError("registration response is missing account or token")
              tokens.append(t)
              s,p=call("GET","/user/profile",token=t)
              if s!=200 or (p.get("user") or {}).get("id")!=uid: raise RuntimeError(f"registered profile HTTP {s}")
              s,l=call("POST","/auth/login",{"email":email,"password":password,**device})
              if s!=200 or (l.get("user") or {}).get("id")!=uid: raise RuntimeError(f"login HTTP {s}")
              t2=l.get("token")
              if not isinstance(t2,str) or not t2: raise RuntimeError("login token missing")
              tokens.append(t2)
              if call("GET","/user/profile",token=t)[0]!=401: raise RuntimeError("old same-device token was not revoked")
              if call("GET","/user/profile",token=t2)[0]!=200: raise RuntimeError("new token cannot access profile")
              s,b=call("DELETE","/user/account",{},t2)
              if s!=200 or b.get("success") is not True: raise RuntimeError(f"delete HTTP {s}")
              removed=deleted()
              if not removed: raise RuntimeError("password login still works after account deletion")
              if call("GET","/user/profile",token=t2)[0]!=401: raise RuntimeError("deleted session token remains valid")
              print("PASS: production registration, persistent profile, password login and same-device token rotation.")
              print("PASS: synthetic production account and every issued session were removed and verified invalid.")
          except Exception as e:
              failure=str(e)
          finally:
              if attempted and not removed:
                  removed=cleanup()
                  if removed: print("CLEANUP: verified synthetic account removal after failure.")
                  else: raise SystemExit("CRITICAL: unable to verify cleanup of the temporary production account.")
          if failure: raise SystemExit("FAIL: "+failure)
          PY
